name: CI

on:
  pull_request:
    # labeled and unlabeled re-run CI when the held label changes (see "Test count" below).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  # "Test count" reads who added the held label.
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required status check for main (branch protection): keep the job name "gate".
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Gate (all packages)
        run: pnpm gate --all
      # Pull requests only. Runs the tests on the base branch and here and counts them. Fails if this branch has fewer,
      # unless the repository owner labelled the pull request held (a held label the night shift added doesn't count),
      # and fails if any test skipped itself while running, held or not. A step, not a job: a skipped job counts as passing.
      - name: Test count (no fewer tests than the base branch)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          pnpm --dir "$RUNNER_TEMP/base" install --frozen-lockfile
          node tools/gates/test-count.mjs --root "$RUNNER_TEMP/base" --save "$RUNNER_TEMP/base-tests.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events" --jq '.[] | tojson' > "$RUNNER_TEMP/pr-events.ndjson"
          node tools/gates/test-count.mjs --compare "$RUNNER_TEMP/base-tests.json" --held-events "$RUNNER_TEMP/pr-events.ndjson" --owner "$OWNER"
      - name: Full fuzz (10,000 games)
        run: pnpm run --if-present fuzz

  # The hooks, the git hooks and the local gate run on the owner's Windows PC, so the tool tests run on Windows too.
  tools-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tool tests
        run: node --test "tools/**/*.test.mjs"
