name: CI

on:
  pull_request:
    # labeled and unlabeled re-run CI when the held label changes (see "Test count" below).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate, the test count and the full fuzz run as three jobs side by side, so CI takes as long as the slowest
  # of them, not their sum. Each one's result reaches main through the "gate" job at the end.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps run test code, so don't leave the token in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Gate (all packages)
        run: pnpm gate --all

  # Pull requests: counts the tests on the base branch and here. Fails if this branch has fewer, unless the repository
  # owner labelled the pull request held (a held label the night shift added doesn't count), and fails if any test
  # skipped itself while running, held or not. The base's counts come from the artifact that main's own CI run for the
  # base commit uploaded, so a pull request no longer installs and runs the base's whole suite. Not the Actions cache:
  # a pull request's run reads its own cache scope before main's, so one commit could save counts that a later commit
  # compares with. Only a push to main makes a run that the artifact is read from. With no such artifact, or when the
  # pull request changes how tests are counted, it counts the base itself as before. The job has no job-level `if:`:
  # a skipped job counts as passing.
  test-count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # "Who labelled held" reads the pull request's label history and main's counts for the base commit.
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Later steps run test code, so don't leave the token in .git/config. Every git command after this is local.
          persist-credentials: false
      # The token is used here and nowhere else, before any package is installed: the steps after it install packages
      # and run test code, so they get no token.
      - name: Who labelled held
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events" --jq '.[] | tojson' > "$RUNNER_TEMP/pr-events.ndjson"
          # main's counts for the base commit, from a run that a push to main made: no pull request can upload to one.
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$BASE_SHA" \
            --json databaseId,headSha,event --jq "[.[] | select(.headSha == \"$BASE_SHA\" and .event == \"push\")][0].databaseId // empty")
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name test-counts --dir "$RUNNER_TEMP/main-counts" ||
              echo "main's run $run for $BASE_SHA has no counts."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Test count (no fewer tests than the base branch)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          main="$RUNNER_TEMP/main-counts/test-counts.json"
          counts="$RUNNER_TEMP/base-counts.json"
          # A failed diff stops the step here (bash -e), rather than reading as "the counting code is unchanged".
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          # main's counts were made by main's counting code: a pull request that changes it counts the base itself.
          # A here-string, not a pipe: with pipefail, grep -q quitting early could fail the writer and read as no match.
          if [ -s "$main" ] && ! grep -qE '^tools/gates/(test-count|count-reporter)\.mjs$' <<< "$changed"; then
            echo "Base counts for $BASE_SHA came from main's CI run."
            cp "$main" "$counts"
          else
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            pnpm --dir "$RUNNER_TEMP/base" install --frozen-lockfile
            node tools/gates/test-count.mjs --root "$RUNNER_TEMP/base" --save "$counts"
          fi
          node tools/gates/test-count.mjs --compare "$counts" --held-events "$RUNNER_TEMP/pr-events.ndjson" --owner "$OWNER"
      # A push to main counts its own tests, for the pull requests whose base it becomes. A failure here only means
      # they count the base themselves, so it doesn't fail main.
      - name: Count main's tests for later pull requests
        id: main-counts
        if: github.event_name == 'push'
        continue-on-error: true
        run: node tools/gates/test-count.mjs --save "$RUNNER_TEMP/test-counts.json"
      - name: Upload main's counts
        if: github.event_name == 'push' && steps.main-counts.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-counts
          path: ${{ runner.temp }}/test-counts.json
          if-no-files-found: error

  # The fuzz: 10,000 random games on main, and on a pull request that changes the engine, content, host, AI, tests/
  # or the root install; 2,000 on any other pull request (tools/gates/fuzz-games.mjs). Nightly plays 10,000 on main.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit, to see what the pull request changed.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Fuzz (10,000 games, or 2,000 when the core is untouched)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            games=$(node tools/gates/fuzz-games.mjs --base "$BASE_SHA")
            # The pull request's own copy of the sizing script can't shorten its own run.
            if git diff --name-only "$BASE_SHA" HEAD | grep -qx 'tools/gates/fuzz-games\.mjs'; then games=10000; fi
          else
            games=$(node tools/gates/fuzz-games.mjs --all)
          fi
          echo "Playing $games games."
          node tools/gates/suites.mjs fuzz --games "$games"

  # The app's Playwright smoke tests (packages/app/e2e) at both sizes in playwright.config.ts, phone and desktop, so a
  # layout break (sideways scroll, buttons under 44 px) fails the pull request. Runs on every pull request, not only
  # ones that touch packages/app: the app renders what the engine and host produce. It gates merges through "gate".
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      # The Chromium build that matches the @playwright/test version packages/app already has, plus its system libraries.
      - name: Install Chromium
        run: pnpm --filter @terminal-dusk/app exec playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: pnpm --filter @terminal-dusk/app test:e2e
      # The report holds each failed test's retry trace (playwright.config.ts): what the test's browser showed, logged
      # and fetched from the local e2e server while it played a throwaway local game. No real match or secret is in it.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 14

  # Every migration applied to an empty database on a local Supabase stack, then the migration tests (which hold the
  # row-level security checks) and the other stack tests. There is no hosted project, so this replaced the owner's
  # review of migrations (owner's policy, 28 Oct 2026). The hook secret is a fresh random test value, never a real one.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start the local Supabase stack, apply every migration and run the stack tests
        working-directory: packages/server
        run: |
          export SEND_EMAIL_HOOK_SECRET="v1,whsec_$(openssl rand -base64 32)"
          # The served Edge Functions read only this git-ignored file, not the shell (src/migrations/localStack.ts).
          printf 'LOCAL_MAIL_URL=http://host.docker.internal:44324\nSEND_EMAIL_HOOK_SECRET=%s\n' "$SEND_EMAIL_HOOK_SECRET" \
            > supabase/functions/.env
          pnpm exec supabase start
          set -a
          eval "$(pnpm exec supabase status -o env)"
          set +a
          # Without the keys the stack tests would only say they did not run, and pass: fail instead.
          if [ -z "$API_URL" ] || [ -z "${ANON_KEY:-$PUBLISHABLE_KEY}" ] || [ -z "${SERVICE_ROLE_KEY:-$SECRET_KEY}" ]; then
            echo "supabase status gave no URL or keys, so the stack tests would not run"
            exit 1
          fi
          pnpm test:migrations
          pnpm test:stack
      - name: Stop the stack
        if: always()
        working-directory: packages/server
        run: pnpm exec supabase stop --no-backup || true

  # Dependencies replaced the owner's review of package.json and the lockfile: a report of every dependency added,
  # removed or changed (in the job summary), and `pnpm audit`, failing on a high or critical advisory the base
  # didn't have, or when it gives no answer on a change that touches dependencies (tools/gates/deps-report.mjs).
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dependency report and new advisories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then BASE_SHA=$(git rev-parse HEAD~1); fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          node tools/gates/deps-report.mjs --base "$RUNNER_TEMP/base"

  # The hooks, the git hooks and the local gate run on the owner's Windows PC, so the tool tests run on Windows too.
  tools-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tool tests
        run: node --test "tools/**/*.test.mjs"

  # Required status check for main (the ruleset): keep the job name "gate". It passes only when every job it needs
  # passed, so the test count, the fuzz, e2e, the database and the dependency check gate merges without a ruleset
  # change. `!cancelled()` makes it run, and fail, when one of them failed: a skipped required job would count as
  # passing.
  gate:
    needs: [checks, test-count, fuzz, e2e, db, deps]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "Not every check passed; the failed job's own log says why:"
            echo "$failed"
            exit 1
          fi
          echo "checks, test-count, fuzz, e2e, db and deps all passed."
