name: Sonar findings

# Each time SonarCloud finishes a commit, copy its findings into a GitHub check named "Sonar findings",
# which `node tools/sonar.mjs <pr|main>` reads (tools/sonar-mirror.mjs). SonarCloud's own check carries only
# some findings, and its API needs SONAR_TOKEN, a repository secret the owner sets once; no agent sees it.
# GitHub runs check_run workflows from main's copy only, so a pull request can't change what this does with it.
# GitHub starts this workflow for every check that finishes on a commit (CI jobs, CodeQL, SonarCloud), and
# `on:` can't filter by check name, so the job's `if` below does it. Every run you see as "skipped" is some other
# check finishing; only SonarCloud's own check does the work. That is expected, not a missed run.
on:
  check_run:
    types: [completed]

permissions:
  contents: read

jobs:
  mirror:
    if: github.event.check_run.name == 'SonarCloud Code Analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # One mirror at a time per commit, so two SonarCloud results for one commit don't write its check at once. At
    # job level and keyed by the check's name too: a workflow-level group would let the skipped runs of other
    # checks on the same commit replace a queued SonarCloud run. A running mirror is never cancelled; a later
    # result waits for it (GitHub keeps only the newest waiting run, which mirrors the same commit).
    concurrency:
      group: sonar-findings-${{ github.event.check_run.head_sha }}-${{ github.event.check_run.name }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Copy SonarCloud's findings
        run: node tools/sonar-mirror.mjs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          DETAILS_URL: ${{ github.event.check_run.details_url }}
