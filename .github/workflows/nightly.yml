name: Nightly

# The full gate and the 10,000-game fuzz on main once a night, so a problem that only shows up across many games is
# caught even on days nothing merges. 09:00 UTC is 5 am Eastern (4 am in winter): after the night shift's pushes,
# before the morning review.
#
# GitHub emails scheduled-run failures only to whoever last edited the schedule, which is the bot. So a failure also
# opens (or comments on) a "Nightly run failed" issue assigned to the owner, and GitHub notifies them of that.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Gate (all packages)
        run: pnpm gate --all
      - name: Full fuzz (10,000 games)
        run: pnpm fuzz
      - name: Tell the owner the nightly run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly run failed"
          body="@astevegreen the nightly gate or 10,000-game fuzz failed on main. Details: $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee astevegreen --label bug
          fi
