# Workspace packages. The gate checks each folder under packages/ and shells/ (tools/gates/gate.mjs).
packages:
  - packages/*
  - shells/*

# One version of each shared tool for the whole repo. Packages ask for it with "catalog:".
# TypeScript stays on 6.0: typescript-eslint and the boundary check need its compiler API, which 7.0 lacks.
catalog:
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  "@vitejs/plugin-react": ^6.0.0
  react: ^19.0.0
  react-dom: ^19.0.0
  typescript: ~6.0.0
  vite: ^8.0.0
  vitest: ^5.0.0

# Supply-chain safety: never install a version published less than 7 days ago (in minutes).
minimumReleaseAge: 10080
